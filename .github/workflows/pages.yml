# Test, then publish the documentation (site root) and the playground (/playground/) to
# GitHub Pages. One-time setup: Settings > Pages > Build and deployment > Source: GitHub
# Actions, and allow the yw-dev branch in Settings > Environments > github-pages >
# Deployment branches.
name: Pages

on:
  push:
    branches: [yw-dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/*.test.mjs tests/conformance/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the documentation
        run: |
          pip install -r docs/requirements.txt
          sphinx-build -W --keep-going -b html docs _site
      - name: Add the playground
        run: |
          cp -r core playground examples _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
