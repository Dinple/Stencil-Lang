# The JavaScript front end and the Python query API, on every push and pull request.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript
        run: node --test tests/*.test.mjs tests/conformance/*.test.mjs
      - name: Python (with the differential tests against JavaScript)
        working-directory: python
        run: STENCIL_NODE=$(which node) python -m unittest discover -s tests -t .
